<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자리 바꾸기</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23203a31'/%3E%3Cg fill='none' stroke='%23dfe9e3' stroke-width='1.8'%3E%3Crect x='5' y='5' width='14' height='3' rx='1'/%3E%3Crect x='5' y='11' width='5.5' height='3' rx='1'/%3E%3Crect x='13.5' y='11' width='5.5' height='3' rx='1'/%3E%3Crect x='5' y='16.5' width='5.5' height='2.5' rx='1'/%3E%3Crect x='13.5' y='16.5' width='5.5' height='2.5' rx='1'/%3E%3C/g%3E%3C/svg%3E">
<!-- 글꼴은 화면을 막지 않도록 나중에 적용 (인터넷이 느리거나 없으면 맑은 고딕으로 표시) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'">
<style>
  :root {
    --bg: #f6f5f1;
    --surface: #ffffff;
    --surface-2: #f3f2ee;
    --surface-3: #ebe9e3;
    --line: #e6e4de;
    --line-strong: #d6d3cb;
    --ink: #1a1a18;
    --ink-2: #4a4945;
    --muted: #8a8882;
    --accent: #1e6b57;
    --accent-ink: #ffffff;
    --accent-soft: #e4f0eb;
    --warn: #b36a12;
    --warn-soft: #fdf2e2;
    --danger: #c0392b;
    --board: #203a31;
    --board-2: #2a4a3e;
    --board-ink: #dfe9e3;
    --floor-dot: #e2dfd7;
    --m: #3563a8;
    --m-soft: #e7eefa;
    --f: #b23b6e;
    --f-soft: #fbe9f1;
    --n-soft: #efeee9;
    --shadow-sm: 0 1px 2px rgba(20, 20, 15, .05);
    --shadow: 0 1px 2px rgba(20, 20, 15, .04), 0 6px 20px -8px rgba(20, 20, 15, .10);
    --shadow-lg: 0 2px 4px rgba(20, 20, 15, .04), 0 18px 40px -16px rgba(20, 20, 15, .18);
    --r: 16px;
    --r-sm: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121311;
      --surface: #1b1c1a;
      --surface-2: #232422;
      --surface-3: #2c2d2a;
      --line: #2e2f2c;
      --line-strong: #3b3c38;
      --ink: #eeede8;
      --ink-2: #c4c3bd;
      --muted: #8e8d87;
      --accent: #5cc19c;
      --accent-ink: #0b1a14;
      --accent-soft: #1d3129;
      --warn: #e8aa55;
      --warn-soft: #362a18;
      --danger: #f2877c;
      --board: #1a2e27;
      --board-2: #213a31;
      --board-ink: #cfded5;
      --floor-dot: #262724;
      --m: #8db4ee;
      --m-soft: #1f2a3b;
      --f: #eb94bb;
      --f-soft: #3a2230;
      --n-soft: #2a2b28;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -10px rgba(0, 0, 0, .5);
      --shadow-lg: 0 2px 4px rgba(0, 0, 0, .3), 0 20px 44px -16px rgba(0, 0, 0, .6);
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; letter-spacing: inherit; }
  button { cursor: pointer; }
  svg { display: block; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- 상단 ---------- */
  .topbar {
    max-width: 1240px; margin: 0 auto; padding: 32px 24px 8px;
    display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .mark {
    width: 44px; height: 44px; border-radius: 13px; background: var(--board);
    display: grid; place-items: center; color: var(--board-ink); box-shadow: var(--shadow);
  }
  .brand h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.03em; }
  .brand p { margin: 1px 0 0; color: var(--muted); font-size: 13.5px; }
  .summary { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--line); font-size: 13px; color: var(--ink-2);
    box-shadow: var(--shadow-sm);
  }
  .chip b { color: var(--ink); font-weight: 650; }
  .dot { width: 7px; height: 7px; border-radius: 50%; }
  .dot.m { background: var(--m); } .dot.f { background: var(--f); }

  .layout {
    max-width: 1240px; margin: 0 auto; padding: 20px 24px 64px;
    display: grid; grid-template-columns: 372px minmax(0, 1fr); gap: 24px; align-items: start;
  }
  aside { position: static; }
  @media (max-width: 960px) {
    .layout { grid-template-columns: 1fr; }
    aside { position: static; }
  }
  @media (max-width: 520px) {
    .topbar, .layout { padding-left: 16px; padding-right: 16px; }
  }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
  .card + .card { margin-top: 24px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 18px 20px 0; }
  .card-head h2 { margin: 0; font-size: 15px; font-weight: 650; }
  .card-body { padding: 14px 20px 20px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }

  /* ---------- 버튼 ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line-strong);
    background: var(--surface); font-weight: 550; font-size: 14px;
    transition: background .15s, border-color .15s, transform .1s, box-shadow .15s;
  }
  .btn:hover:not(:disabled) { background: var(--surface-2); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn:focus-visible, .icon-btn:focus-visible, .gtoggle button:focus-visible, .seg label:has(input:focus-visible) {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .btn.primary {
    background: var(--accent); border-color: transparent; color: var(--accent-ink);
    box-shadow: 0 1px 0 rgba(255,255,255,.15) inset, 0 6px 16px -6px color-mix(in srgb, var(--accent) 60%, transparent);
  }
  .btn.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 88%, #000); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.ghost:hover:not(:disabled) { background: var(--surface-2); color: var(--danger); }
  .btn.cta { width: 100%; height: 50px; font-size: 16px; border-radius: 12px; margin-top: 18px; }
  .spinner {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- 명단 ---------- */
  .roster { display: grid; gap: 2px; max-height: min(52vh, 560px); overflow-y: auto; margin: 0 -8px; padding: 0 8px; }
  .row {
    display: grid; grid-template-columns: 30px minmax(0, 1fr) auto 58px 28px; align-items: center; gap: 8px;
    padding: 5px 6px; border-radius: 10px; transition: background .12s;
  }
  .row:hover, .row:focus-within { background: var(--surface-2); }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    font-size: 13px; font-weight: 650; background: var(--n-soft); color: var(--ink-2); flex: none;
  }
  .avatar.m { background: var(--m-soft); color: var(--m); }
  .avatar.f { background: var(--f-soft); color: var(--f); }
  .row input {
    width: 100%; min-width: 0; height: 32px; padding: 0 8px; border-radius: 8px;
    border: 1px solid transparent; background: transparent; transition: border-color .12s, background .12s;
  }
  .row input:hover { border-color: var(--line-strong); }
  .row input:focus { outline: none; border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px var(--accent-soft); }
  .row input.score { text-align: right; font-variant-numeric: tabular-nums; }
  .row input::placeholder { color: var(--muted); }
  .row input::-webkit-inner-spin-button { display: none; }
  .row input[type=number] { -moz-appearance: textfield; }
  .gtoggle { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--surface-3); }
  .gtoggle button {
    width: 28px; height: 26px; border: 0; border-radius: 6px; background: transparent;
    font-size: 12.5px; font-weight: 600; color: var(--muted); transition: background .12s, color .12s;
  }
  .gtoggle button:hover { color: var(--ink); }
  .gtoggle button.on.m { background: var(--surface); color: var(--m); box-shadow: var(--shadow-sm); }
  .gtoggle button.on.f { background: var(--surface); color: var(--f); box-shadow: var(--shadow-sm); }
  .icon-btn {
    width: 28px; height: 28px; display: grid; place-items: center; border: 0; border-radius: 8px;
    background: transparent; color: var(--muted); opacity: 0; transition: opacity .12s, background .12s, color .12s;
  }
  .row:hover .icon-btn, .row:focus-within .icon-btn { opacity: 1; }
  @media (hover: none) { .icon-btn { opacity: 1; } }
  .icon-btn:hover { background: var(--surface-3); color: var(--danger); }
  .add-row {
    width: 100%; margin-top: 8px; height: 40px; border-radius: 10px; border: 1.5px dashed var(--line-strong);
    background: transparent; color: var(--muted); font-weight: 550; display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: border-color .15s, color .15s, background .15s;
  }
  .add-row:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .add-row:disabled { opacity: .5; cursor: not-allowed; }
  .progress { height: 4px; border-radius: 99px; background: var(--surface-3); overflow: hidden; margin-top: 6px; width: 84px; }
  .progress > i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width .25s; }

  .divider { height: 1px; background: var(--line); margin: 18px -20px; }
  .field + .field { margin-top: 14px; }
  .field-label { font-size: 12.5px; color: var(--muted); font-weight: 550; margin-bottom: 7px; display: block; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 3px; border-radius: 10px; background: var(--surface-3); }
  .seg label {
    text-align: center; padding: 7px 4px; border-radius: 8px; font-size: 13.5px; font-weight: 550;
    color: var(--muted); cursor: pointer; transition: background .15s, color .15s;
  }
  .seg label:hover { color: var(--ink); }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label:has(input:checked) { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }

  /* ---------- 결과 ---------- */
  .badge {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600;
    padding: 4px 10px; border-radius: 999px; background: var(--surface-3); color: var(--muted);
  }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.done { background: var(--accent-soft); color: var(--accent); }
  .badge.pending { background: var(--warn-soft); color: var(--warn); }

  .empty { display: grid; place-items: center; text-align: center; padding: 64px 16px 72px; color: var(--muted); }
  .empty svg { color: var(--line-strong); margin-bottom: 18px; }
  .empty strong { display: block; color: var(--ink); font-size: 16px; font-weight: 650; margin-bottom: 4px; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  @media (max-width: 520px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .tile { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface); }
  .tile-label { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .tile-label::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .tile.warn .tile-label::before { background: var(--warn); }
  .tile.off .tile-label::before { background: var(--line-strong); }
  .tile-value { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .tile-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .tile.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
  .tile.warn .tile-value { color: var(--warn); }

  .notes { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 6px; }
  .notes li {
    font-size: 13.5px; padding: 9px 12px; border-radius: 10px; background: var(--warn-soft); color: var(--ink-2);
    display: flex; gap: 8px; align-items: flex-start;
  }
  .notes li svg { color: var(--warn); flex: none; margin-top: 2px; }

  .classroom {
    margin-top: 16px; border-radius: 14px; padding: 22px 20px 26px; border: 1px solid var(--line);
    background-color: var(--surface-2);
    background-image: radial-gradient(var(--floor-dot) 1px, transparent 1.2px);
    background-size: 16px 16px;
  }
  .board {
    width: min(64%, 520px); margin: 0 auto 26px; height: 46px; border-radius: 8px; position: relative;
    background: linear-gradient(180deg, var(--board-2), var(--board));
    box-shadow: 0 0 0 5px color-mix(in srgb, var(--board) 35%, var(--surface-3)), var(--shadow);
    display: grid; place-items: center; color: var(--board-ink); font-size: 13px; letter-spacing: .5em; font-weight: 500;
  }
  .board::after {
    content: ""; position: absolute; bottom: -9px; left: 50%; transform: translateX(-50%);
    width: 22%; height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--board) 35%, var(--surface-3));
  }
  .desks { display: grid; gap: 14px; }
  .desk {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px;
    box-shadow: var(--shadow); position: relative;
    animation: deskIn .45s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i) * 35ms);
  }
  @keyframes deskIn { from { opacity: 0; transform: translateY(10px) scale(.97); } }
  @media (prefers-reduced-motion: reduce) { .desk { animation: none; } }
  .desk.flag { border-color: color-mix(in srgb, var(--warn) 55%, transparent); box-shadow: 0 0 0 3px var(--warn-soft), var(--shadow); }
  .desk-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin: 0 2px 8px; min-height: 20px; }
  .desk-no { font-size: 12px; font-weight: 650; color: var(--muted); font-variant-numeric: tabular-nums; }
  .flags { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .flag-chip { font-size: 11px; font-weight: 600; color: var(--warn); background: var(--warn-soft); padding: 1px 7px; border-radius: 999px; }
  .desk-seats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .seat {
    border-radius: 10px; padding: 12px 6px 10px; text-align: center; min-width: 0;
    background: var(--surface-2); display: grid; justify-items: center; gap: 2px; position: relative;
  }
  .seat .avatar { width: 36px; height: 36px; font-size: 15px; margin-bottom: 4px; }
  .seat .name { font-weight: 650; font-size: 14.5px; overflow-wrap: anywhere; line-height: 1.3; }
  .seat .meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  @media (max-width: 520px) {
    .classroom { padding: 16px 10px 18px; }
    .board { width: 76%; margin-bottom: 20px; }
    .desks { gap: 10px; }
    .desk { padding: 8px; }
    .desk-seats { gap: 5px; }
    .seat { padding: 10px 3px 8px; }
    .seat .meta { font-size: 11.5px; }
    .actions .btn.primary { flex: 1 0 100%; }
  }
  .seat .meta .m { color: var(--m); font-weight: 600; }
  .seat .meta .f { color: var(--f); font-weight: 600; }
  .seat.same { background: var(--warn-soft); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--warn) 55%, transparent); }
  .seat-badge {
    position: absolute; top: 5px; right: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--warn);
  }
  .seat.vacant {
    background: transparent; border: 1.5px dashed var(--line-strong); color: var(--muted);
    place-content: center; font-size: 13px;
  }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; align-items: center; }
  .actions .spacer { flex: 1; }
  .busy { opacity: .45; pointer-events: none; transition: opacity .2s; }

  /* ---------- 기록 ---------- */
  .timeline { position: relative; display: grid; gap: 4px; }
  .timeline::before {
    content: ""; position: absolute; left: 11px; top: 14px; bottom: 14px; width: 2px; background: var(--line); border-radius: 1px;
  }
  .t-item { position: relative; padding-left: 34px; }
  .t-item::before {
    content: ""; position: absolute; left: 6px; top: 13px; width: 12px; height: 12px; border-radius: 50%;
    background: var(--surface); border: 2px solid var(--line-strong);
  }
  .t-item.latest::before { border-color: var(--accent); background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .t-item summary {
    list-style: none; cursor: pointer; padding: 8px 10px; border-radius: 10px;
    display: flex; align-items: center; gap: 10px; transition: background .12s;
  }
  .t-item summary::-webkit-details-marker { display: none; }
  .t-item summary:hover { background: var(--surface-2); }
  .t-item summary b { font-weight: 650; font-size: 14px; }
  .t-item summary .chev { margin-left: auto; color: var(--muted); transition: transform .2s; }
  .t-item[open] summary .chev { transform: rotate(180deg); }
  .t-pairs {
    list-style: none; margin: 2px 0 10px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2);
    display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 4px 18px; font-size: 13px;
  }
  .t-pairs span { color: var(--muted); display: inline-block; min-width: 2.6em; font-variant-numeric: tabular-nums; }

  /* ---------- 알림 ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 28px; z-index: 10; display: flex; align-items: center; gap: 10px;
    transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
    background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-size: 14px; font-weight: 500;
    box-shadow: var(--shadow-lg); transition: opacity .2s, transform .25s cubic-bezier(.2, .8, .2, 1);
    max-width: calc(100% - 32px);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.error { background: var(--danger); color: #fff; }

  @media print {
    body { background: #fff; color: #000; }
    .topbar, aside, #historyCard, .actions, .tiles, .notes, .card-head { display: none !important; }
    .layout { display: block; padding: 0; }
    .card, .classroom { border: 0; box-shadow: none; background: #fff; padding: 0; }
    .desk { box-shadow: none; border-color: #bbb; animation: none; }
    .seat { background: #f4f4f4; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .board { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }

  /* ---------- 정적 버전 추가 ---------- */
  .btn.sm { height: 32px; padding: 0 10px; font-size: 13px; border-radius: 8px; gap: 5px; }
  .head-actions { display: flex; gap: 2px; flex-wrap: wrap; justify-content: flex-end; }
  .btn.ghost.neutral:hover:not(:disabled) { color: var(--ink); }
  .tools { display: flex; gap: 6px; margin-top: 8px; }
  .tools .btn { flex: 1; }
  .roster-empty { text-align: center; padding: 26px 8px 18px; color: var(--muted); font-size: 13.5px; }
  .roster-empty strong { display: block; color: var(--ink); font-size: 15px; margin-bottom: 2px; }
  .footnote { max-width: 1240px; margin: -40px auto 0; padding: 0 24px 40px; color: var(--muted); font-size: 12.5px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media print { .footnote { display: none; } }

  /* ---------- 짝 금지 ---------- */
  .hint { font-weight: 400; margin-left: 4px; }
  .ban-form { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto; gap: 6px; align-items: center; }
  .ban-form select {
    width: 100%; min-width: 0; height: 32px; padding: 0 8px; border-radius: 8px;
    border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font: inherit; font-size: 13.5px;
  }
  .ban-form select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .ban-x { color: var(--muted); font-size: 12px; }

<script>
/* ============================================================
   배치 알고리즘
   ============================================================ */
const MAX_STUDENTS = 20;
const BANNED_PAIR_PENALTY = 1e6; // 짝 금지로 설정한 두 학생이 짝이 되는 경우 (가장 우선)
const PAST_PAIR_PENALTY = 1000;  // 예전 짝과 다시 짝이 되는 경우 (1회당)
const SOLO_REPEAT_PENALTY = 500; // 혼자 앉았던 학생이 또 혼자 앉는 경우
const GENDER_PENALTY = 300;      // 성별 배치 방식에 맞지 않는 짝
const GRADE_WEIGHT = 10;         // 짝의 성적 단계 합이 평균에서 벗어난 정도 (상=3, 중=2, 하=1)
const SEARCH_TRIES = 300;        // 랜덤 시작 횟수

const GRADES = ["상", "중", "하"];
const GRADE_LEVEL = { "상": 3, "중": 2, "하": 1 };
const GRADE_ALIASES = { "상": "상", "중": "중", "하": "하", "high": "상", "mid": "중", "middle": "중", "low": "하" };
const GENDER_RULES = { mixed: "남녀 짝", same: "같은 성별 짝" };
const GENDER_ALIASES = { "남": "남", "남자": "남", "m": "남", "male": "남",
                         "여": "여", "여자": "여", "f": "여", "female": "여" };

class StudentError extends Error {}

const isNumeric = (v) => String(v ?? "").trim() !== "" && Number.isFinite(Number(v));

/** 예전 점수(숫자)를 상/중/하로 바꾼다: 점수 순으로 위 1/3은 상, 아래 1/3은 하, 나머지는 중. 동점은 같은 단계. */
function withGrades(rows) {
  const out = rows.map((r) => ({ name: r.name, gender: r.gender, grade: r.grade ?? r.score }));
  const numeric = out.filter((r) => !Object.hasOwn(GRADE_ALIASES, String(r.grade ?? "").trim().toLowerCase())
                                    && isNumeric(r.grade));
  numeric.sort((a, b) => Number(b.grade) - Number(a.grade));
  const third = Math.round(numeric.length / 3);
  let prevScore = null, prevGrade = null;
  numeric.forEach((r, i) => {
    const score = Number(r.grade);
    const grade = score === prevScore ? prevGrade : i < third ? "상" : i >= numeric.length - third ? "하" : "중";
    prevScore = score; prevGrade = grade;
    r.grade = grade;
  });
  return { rows: out, converted: numeric.length };
}

/** [{name, gender, grade}] → Map(이름 → {grade, gender}) */
function parseStudents(rows, checkCount = true) {
  const students = new Map();
  for (const row of rows) {
    const name = String(row.name ?? "").trim();
    if (!name) continue;
    if (students.has(name)) throw new StudentError(`이름이 중복되었습니다: ${name}`);

    const rawGender = String(row.gender ?? "").trim().toLowerCase();
    if (rawGender && !Object.hasOwn(GENDER_ALIASES, rawGender)) {
      throw new StudentError(`${name}의 성별을 알 수 없습니다: ${row.gender} (남/여로 입력해주세요)`);
    }
    const rawGrade = String(row.grade ?? "").trim().toLowerCase();
    if (!Object.hasOwn(GRADE_ALIASES, rawGrade)) {
      throw new StudentError(`${name}의 성적을 상/중/하 중에서 골라주세요.`);
    }
    students.set(name, { grade: GRADE_ALIASES[rawGrade], gender: GENDER_ALIASES[rawGender] ?? null });
  }
  if (checkCount) {
    if (students.size < 2) throw new StudentError("학생이 2명 이상이어야 합니다.");
    if (students.size > MAX_STUDENTS) {
      throw new StudentError(`학생은 최대 ${MAX_STUDENTS}명까지 가능합니다. (현재 ${students.size}명)`);
    }
  }
  return students;
}

const pairKey = (a, b) => (a < b ? `${a}\u0000${b}` : `${b}\u0000${a}`);

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function isGenderMismatch(g1, g2, mode) {
  if (!mode || !g1 || !g2) return false;
  return mode === "mixed" ? g1 === g2 : g1 !== g2;
}

class Arranger {
  constructor(students, history, genderMode, bannedPairs = []) {
    this.students = students;
    this.mode = genderMode === "none" ? null : genderMode;
    this.banned = new Set(bannedPairs.filter(([a, b]) => students.has(a) && students.has(b))
      .map(([a, b]) => pairKey(a, b)));
    this.pairCount = new Map();
    this.soloCount = new Map();
    for (const rec of history) {
      for (const [a, b] of rec.pairs) {
        const k = pairKey(a, b);
        this.pairCount.set(k, (this.pairCount.get(k) || 0) + 1);
      }
      if (rec.solo) this.soloCount.set(rec.solo, (this.soloCount.get(rec.solo) || 0) + 1);
    }
    this.lastDesk = history.length ? history[history.length - 1].seats || {} : {};
    const levels = [...students.values()].map((s) => GRADE_LEVEL[s.grade]);
    this.targetSum = (2 * levels.reduce((a, b) => a + b, 0)) / levels.length;
  }

  level(name) {
    return GRADE_LEVEL[this.students.get(name).grade];
  }

  genderMismatch(a, b) {
    return isGenderMismatch(this.students.get(a).gender, this.students.get(b).gender, this.mode);
  }

  isBanned(a, b) {
    return this.banned.has(pairKey(a, b));
  }

  pairCost(a, b) {
    let cost = PAST_PAIR_PENALTY * (this.pairCount.get(pairKey(a, b)) || 0);
    if (this.isBanned(a, b)) cost += BANNED_PAIR_PENALTY;
    if (this.genderMismatch(a, b)) cost += GENDER_PENALTY;
    cost += GRADE_WEIGHT * Math.abs(this.level(a) + this.level(b) - this.targetSum);
    return cost;
  }

  /** order를 앞에서부터 두 명씩 짝지음. 홀수면 마지막 한 명은 혼자. */
  totalCost(order) {
    let cost = 0;
    for (let i = 0; i + 1 < order.length; i += 2) cost += this.pairCost(order[i], order[i + 1]);
    if (order.length % 2 === 1) cost += SOLO_REPEAT_PENALTY * (this.soloCount.get(order[order.length - 1]) || 0);
    return cost;
  }

  /** 두 학생의 자리를 맞바꿔 비용이 줄면 반영하는 과정을 더 이상 개선이 없을 때까지 반복. */
  improve(order) {
    let best = this.totalCost(order);
    let improved = true;
    while (improved) {
      improved = false;
      for (let i = 0; i < order.length; i++) {
        for (let j = i + 1; j < order.length; j++) {
          if ((i >> 1) === (j >> 1)) continue; // 같은 짝끼리 바꾸는 건 의미 없음
          [order[i], order[j]] = [order[j], order[i]];
          const cost = this.totalCost(order);
          if (cost < best - 1e-9) { best = cost; improved = true; }
          else [order[i], order[j]] = [order[j], order[i]];
        }
      }
    }
    return best;
  }

  deskConflicts(group, desk) {
    return group.filter((name) => this.lastDesk[name] === desk).length;
  }

  /** 연속으로 같은 책상에 앉는 학생 수가 maxConflicts 이하인 책상 배정을 무작위로 찾는다. */
  assignDesks(groups, maxConflicts) {
    const deskNumbers = shuffle(groups.map((_, i) => i + 1));
    const assignment = new Map();
    const used = new Set();
    const backtrack = (idx, conflicts) => {
      if (idx === groups.length) return true;
      for (const desk of deskNumbers) {
        if (used.has(desk)) continue;
        const c = conflicts + this.deskConflicts(groups[idx], desk);
        if (c > maxConflicts) continue;
        used.add(desk); assignment.set(desk, groups[idx]);
        if (backtrack(idx + 1, c)) return true;
        used.delete(desk); assignment.delete(desk);
      }
      return false;
    };
    if (!backtrack(0, 0)) return null;
    return groups.map((_, i) => assignment.get(i + 1));
  }

  /** 비용이 낮은 짝 조합부터, 지난번과 같은 책상에 앉는 학생이 없게 배정되는지 확인한다. */
  arrange(tries = SEARCH_TRIES) {
    const names = [...this.students.keys()];
    const candidates = new Map();
    for (let t = 0; t < tries; t++) {
      const order = shuffle(names.slice());
      const cost = this.improve(order);
      const groups = [];
      for (let i = 0; i < order.length; i += 2) groups.push(order.slice(i, i + 2));
      const key = groups.map((g) => g.slice().sort().join("\u0000")).sort().join("\u0001");
      const banned = groups.filter((g) => g.length === 2 && this.isBanned(...g)).length;
      if (!candidates.has(key)) candidates.set(key, { cost, groups, banned });
    }
    // 짝 금지를 가장 적게 어기는 조합만 남긴다 (책상 조건 때문에 짝 금지를 어기는 일이 없도록)
    const fewestBanned = Math.min(...[...candidates.values()].map((c) => c.banned));
    const ranked = [...candidates.values()].filter((c) => c.banned === fewestBanned)
      .sort((a, b) => a.cost - b.cost).map((c) => c.groups);

    for (let maxConflicts = 0; maxConflicts <= names.length; maxConflicts++) {
      for (const groups of ranked) {
        const sided = groups.map((g) => shuffle(g.slice())); // 책상 안 왼쪽/오른쪽은 무작위
        const desks = this.assignDesks(sided, maxConflicts);
        if (desks) return desks;
      }
    }
  }

  report(desks) {
    const pairs = desks.filter((g) => g.length === 2);
    return {
      banned_count: this.banned.size,
      banned: pairs.filter(([a, b]) => this.isBanned(a, b)),
      repeats: pairs.filter(([a, b]) => this.pairCount.get(pairKey(a, b)))
        .map(([a, b]) => ({ pair: [a, b], count: this.pairCount.get(pairKey(a, b)) })),
      same_desk: desks.flatMap((g, i) => g.filter((n) => this.lastDesk[n] === i + 1)),
      has_last_desk: Object.keys(this.lastDesk).length > 0,
      gender_rule: this.mode ? GENDER_RULES[this.mode] : null,
      gender_mismatches: pairs.filter(([a, b]) => this.genderMismatch(a, b)),
      has_gender: [...this.students.values()].some((s) => s.gender),
      pair_total: pairs.length,
      // 상+하 또는 중+중처럼 두 사람의 성적 단계 합이 4인 짝
      grade_balanced: pairs.filter(([a, b]) => this.level(a) + this.level(b) === 4).length,
    };
  }
}

function makeRecord(desks) {
  const seats = {};
  desks.forEach((g, i) => g.forEach((n) => (seats[n] = i + 1)));
  return {
    date: nowText(),
    pairs: desks.filter((g) => g.length === 2),
    solo: desks.find((g) => g.length === 1)?.[0] ?? null,
    seats,
  };
}

function nowText() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* ============================================================
   저장 (이 브라우저의 localStorage)
   ============================================================ */
const STORE_KEY = "changedesk:v1";
let storageWarned = false;

function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch {
    return null;
  }
}

function saveStore() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      students: state.students, history: state.history, bans: state.bans,
      genderMode: genderMode(), cols: columns(),
    }));
  } catch {
    if (!storageWarned) {
      storageWarned = true;
      toast("이 브라우저에서는 저장이 안 돼요. 창을 닫기 전에 백업을 받아주세요.", true);
    }
  }
}

const SAMPLE = [
  ["김민준", "남", "상"], ["이서연", "여", "상"], ["박도윤", "남", "중"], ["최지우", "여", "하"],
  ["정하준", "남", "중"], ["강서윤", "여", "상"], ["조시우", "남", "하"], ["윤하은", "여", "중"],
  ["장예준", "남", "중"], ["임지민", "여", "하"], ["한주원", "남", "상"], ["오수아", "여", "중"],
  ["서지호", "남", "하"], ["신채원", "여", "상"], ["권유준", "남", "하"], ["황다은", "여", "중"],
].map(([name, gender, grade]) => ({ name, gender, grade }));

/** 저장된 학생 목록을 {name, gender, grade} 형태로 정리한다 (예전 숫자 점수는 상/중/하로 변환). */
function normalizeStudents(list) {
  if (!Array.isArray(list)) return { rows: [], converted: 0 };
  const { rows, converted } = withGrades(list.filter((s) => s && typeof s === "object"));
  return {
    rows: rows.map((s) => {
      const g = String(s.gender ?? "").trim().toLowerCase();
      const lv = String(s.grade ?? "").trim().toLowerCase();
      return {
        name: String(s.name ?? ""),
        gender: GENDER_ALIASES[g] ?? null,
        grade: Object.hasOwn(GRADE_ALIASES, lv) ? GRADE_ALIASES[lv] : null,
      };
    }),
    converted,
  };
}

function icon(name, size = 16) {
  const span = document.createElement("span");
  span.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`;
  return span.firstChild;
}

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null && v !== false) node.setAttribute(k, v);
  }
  for (const c of children.flat()) if (c !== null && c !== undefined && c !== false) node.append(c);
  return node;
}

let toastTimer;
function toast(msg, isError = false) {
  const t = $("toast");
  t.replaceChildren(icon(isError ? "alert" : "check"), msg);
  t.className = "toast show" + (isError ? " error" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.className = "toast" + (isError ? " error" : "")), isError ? 4200 : 2400);
}

const initial = (name) => (name || "").trim().charAt(0) || "?";
const avatar = (s) => el("div", { class: "avatar " + (GCLASS[s.gender] || ""), "aria-hidden": "true" }, initial(s.name));
const namedStudents = () => state.students.filter((s) => s.name.trim());
const countBy = (list, key, value) => list.filter((s) => s[key] === value).length;

function download(filename, text) {
  const a = el("a", { href: URL.createObjectURL(new Blob([text], { type: "application/json" })), download: filename });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- 화면 전환 ---------- */
const SCREENS = ["students", "seats"];

function showScreen(name) {
  for (const s of SCREENS) $(`screen-${s}`).hidden = s !== name;
  document.querySelectorAll(".nav a").forEach((a) =>
    a.setAttribute("aria-current", a.dataset.screen === name ? "page" : "false"));
  if (name === "seats") renderConditions();
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", () => {
  const name = location.hash.slice(1);
  if (SCREENS.includes(name)) showScreen(name);
});

/** 명단이나 짝 금지가 바뀌면 저장하고, 아직 확정하지 않은 배치 결과는 지운다. */
function dataChanged() {
  saveStore();
  if (state.desks) {
    state.desks = null;
    renderResult();
  }
  renderRosterMeta();
  renderBans();
}

/* ============================================================
   1. 학생 정보 화면
   ============================================================ */
function renderRosterMeta() {
  const list = namedStudents();
  const n = state.students.length;
  $("count").textContent = `${n} / ${MAX_STUDENTS}명`;
  $("progress").style.width = `${Math.min(100, (n / MAX_STUDENTS) * 100)}%`;
  $("rosterStats").replaceChildren(
    el("span", { class: "chip" }, el("i", { class: "dot m" }), "남 ", el("b", { class: "num" }, countBy(list, "gender", "남")),
      el("i", { class: "dot f", style: "margin-left:4px" }), "여 ", el("b", { class: "num" }, countBy(list, "gender", "여"))),
    el("span", { class: "chip" }, ...GRADES.flatMap((g, i) =>
      [i ? " · " : "", `${g} `, el("b", { class: "num" }, countBy(list, "grade", g))])),
  );
  const add = $("addBtn");
  add.disabled = n >= MAX_STUDENTS;
  add.replaceChildren(icon("plus", 15), n >= MAX_STUDENTS ? `최대 ${MAX_STUDENTS}명까지 가능해요` : "학생 추가");
  $("clearBtn").disabled = n === 0;
}

function toggle(options, current, onPick, cls, label) {
  return el("div", { class: "gtoggle", role: "group", "aria-label": label }, options.map((o) =>
    el("button", {
      type: "button", class: `${cls(o)}${current === o ? " on" : ""}`, "aria-pressed": String(current === o),
      title: current === o ? "다시 누르면 선택 해제" : `${label}: ${o}`,
      onclick: () => onPick(current === o ? null : o),
    }, o)));
}

function renderRoster() {
  const roster = $("roster");
  if (!state.students.length) {
    roster.replaceChildren(el("div", { class: "roster-empty" },
      el("strong", {}, "학생이 없어요"),
      "학생을 추가하거나 CSV 파일을 불러오세요."));
  } else {
    roster.replaceChildren(...state.students.map((s, i) => {
      const av = avatar(s);
      return el("div", { class: "row" },
        av,
        el("input", { value: s.name, placeholder: "이름", "aria-label": "이름",
          oninput: (e) => {
            const oldName = s.name.trim();
            s.name = e.target.value;
            renameInBans(oldName, s.name.trim());
            av.textContent = initial(s.name);
            dataChanged();
          },
          onchange: () => { pruneBans(); dataChanged(); } }),
        toggle(["남", "여"], s.gender, (g) => { s.gender = g; renderRoster(); dataChanged(); }, (g) => GCLASS[g], "성별"),
        toggle(GRADES, s.grade, (g) => { s.grade = g; renderRoster(); dataChanged(); }, () => "lv", "성적"),
        el("button", { class: "icon-btn", type: "button", title: "삭제", "aria-label": `${s.name || "학생"} 삭제`,
          onclick: () => { state.students.splice(i, 1); pruneBans(); renderRoster(); dataChanged(); } }, icon("x", 15)),
      );
    }));
  }
  renderRosterMeta();
}

$("addBtn").addEventListener("click", () => {
  if (state.students.length >= MAX_STUDENTS) return;
  state.students.push({ name: "", gender: null, grade: "중" });
  renderRoster();
  dataChanged();
  const rows = $("roster").querySelectorAll(".row");
  rows[rows.length - 1]?.querySelector("input")?.focus();
});

function replaceRoster(rows, what) {
  if (namedStudents().length && !confirm(`지금 명단을 ${what}(으)로 바꿀까요?`)) return false;
  state.students = rows;
  pruneBans();
  renderRoster();
  dataChanged();
  return true;
}

$("sampleBtn").addEventListener("click", () => {
  if (replaceRoster(SAMPLE.map((s) => ({ ...s })), "예시 명단")) toast("예시 명단을 넣었어요.");
});

$("clearBtn").replaceChildren(icon("trash", 14), "모두 지우기");
$("clearBtn").addEventListener("click", () => {
  if (!confirm("명단의 학생을 모두 지울까요? 짝 금지 설정도 함께 지워집니다.")) return;
  state.students = [];
  pruneBans();
  renderRoster();
  dataChanged();
});

/** 이름,성별,성적 헤더가 있는 CSV. 성적은 상/중/하 또는 숫자(자동 변환). 성별 열은 없어도 된다. */
function parseCsv(text) {
  const lines = text.replace(/^﻿/, "").split(/\r?\n/).filter((l) => l.trim());
  if (!lines.length) throw new StudentError("CSV 파일이 비어 있어요.");
  const cells = (line) => line.split(",").map((c) => c.trim().replace(/^"(.*)"$/, "$1"));
  const header = cells(lines[0]);
  const col = (...names) => header.findIndex((h) => names.includes(h.toLowerCase()));
  const iName = col("이름", "name"), iGender = col("성별", "gender");
  const iGrade = col("성적", "점수", "등급", "score", "grade");
  if (iName < 0 || iGrade < 0) throw new StudentError("CSV 첫 줄에 '이름'과 '성적' 열이 있어야 해요. (예: 이름,성별,성적)");
  const raw = lines.slice(1).map(cells).map((c) => ({
    name: c[iName] ?? "", gender: iGender >= 0 ? c[iGender] : "", grade: c[iGrade] ?? "",
  }));
  const { rows, converted } = withGrades(raw);
  const students = parseStudents(rows);  // 형식과 인원 검사
  return { rows: [...students].map(([name, s]) => ({ name, gender: s.gender, grade: s.grade })), converted };
}

$("csvBtn").replaceChildren(icon("upload", 14), "CSV 불러오기");
$("csvBtn").addEventListener("click", () => $("csvFile").click());
$("csvFile").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  try {
    const { rows, converted } = parseCsv(await file.text());
    if (replaceRoster(rows, `${file.name}의 명단`)) {
      toast(`${rows.length}명을 불러왔어요.` + (converted ? " 점수는 상/중/하로 바꿨어요." : ""));
    }
  } catch (err) {
    toast(err instanceof StudentError ? err.message : "CSV 파일을 읽지 못했어요.", true);
  }
});

$("goSeats").replaceChildren("자리 배치하러 가기", icon("arrow", 16));

/* ---------- 짝 금지 ---------- */
const rosterNames = () => [...new Set(state.students.map((s) => s.name.trim()).filter(Boolean))];

/** 명단에 없는 학생이 들어 있는 짝 금지 항목을 지운다. */
function pruneBans() {
  const names = new Set(rosterNames());
  state.bans = state.bans.filter(([a, b]) => names.has(a) && names.has(b));
}

/** 학생 이름을 고치면 짝 금지 항목의 이름도 같이 바꾼다. */
function renameInBans(oldName, newName) {
  if (!oldName || oldName === newName) return;
  if (state.students.some((s) => s.name.trim() === oldName)) return; // 같은 이름이 아직 남아 있음
  state.bans = state.bans.map((pair) => pair.map((n) => (n === oldName ? newName : n)));
}

function renderBans() {
  const names = rosterNames();
  for (const id of ["banA", "banB"]) {
    const sel = $(id);
    const prev = sel.value;
    sel.replaceChildren(el("option", { value: "" }, "학생 선택"), ...names.map((n) => el("option", { value: n }, n)));
    sel.value = names.includes(prev) ? prev : "";
  }
  $("banAdd").disabled = names.length < 2;
  $("banList").replaceChildren(...state.bans.map(([a, b], i) =>
    el("span", { class: "ban-chip" }, a, el("span", { class: "sep", "aria-hidden": "true" }, "✕"), b,
      el("button", { type: "button", title: "삭제", "aria-label": `${a}, ${b} 짝 금지 해제`,
        onclick: () => { state.bans.splice(i, 1); dataChanged(); } }, icon("x", 12)))));
}

$("banAdd").addEventListener("click", () => {
  const a = $("banA").value, b = $("banB").value;
  if (!a || !b) return toast("짝 금지할 학생 두 명을 골라주세요.", true);
  if (a === b) return toast("서로 다른 학생을 골라주세요.", true);
  if (state.bans.some((p) => pairKey(...p) === pairKey(a, b))) return toast("이미 추가된 조합이에요.", true);
  state.bans.push([a, b]);
  $("banA").value = "";
  $("banB").value = "";
  dataChanged();
  toast(`${a} · ${b} 학생은 짝이 되지 않도록 배치할게요.`);
});

/* ---------- 데이터 저장 (백업 / 복원) ---------- */
$("backupBtn").replaceChildren(icon("download", 15), "백업 파일 저장");
$("backupBtn").addEventListener("click", () => {
  const data = { app: "changedesk", version: 2, students: state.students, history: state.history,
                 bans: state.bans, genderMode: genderMode(), cols: columns() };
  download(`자리바꾸기_백업_${nowText().slice(0, 10)}.json`, JSON.stringify(data, null, 2));
  toast("백업 파일을 저장했어요.");
});

function isValidHistory(h) {
  return Array.isArray(h) && h.every((r) => r && Array.isArray(r.pairs) && r.pairs.every((p) => Array.isArray(p) && p.length === 2));
}

/** 저장된 짝 금지 목록에서 올바른 [이름, 이름] 항목만 남긴다. */
function validBans(bans) {
  if (!Array.isArray(bans)) return [];
  return bans.filter((p) => Array.isArray(p) && p.length === 2 && p.every((n) => typeof n === "string" && n) && p[0] !== p[1]);
}

function applySettings(data) {
  if (data.genderMode) document.querySelector(`input[name="gender"][value="${data.genderMode}"]`)?.click();
  if (data.cols) document.querySelector(`input[name="cols"][value="${data.cols}"]`)?.click();
}

$("restoreBtn").replaceChildren(icon("upload", 15), "백업 불러오기");
$("restoreBtn").addEventListener("click", () => $("restoreFile").click());
$("restoreFile").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    // 백업 파일({students, history, ...}) 또는 예전 파이썬 버전의 history.json(배열)을 받는다
    const history = Array.isArray(data) ? data : data.history;
    if (!isValidHistory(history)) throw new Error();
    const restored = Array.isArray(data) ? null : normalizeStudents(data.students);
    if (!confirm(`${file.name}에서 ${restored ? "명단과 " : ""}기록 ${history.length}회를 불러올까요? 지금 내용은 바뀝니다.`)) return;
    state.history = history;
    if (restored) {
      state.students = restored.rows;
      state.bans = validBans(data.bans);
      applySettings(data);
    }
    pruneBans();
    renderRoster();
    dataChanged();
    renderHistory();
    toast("복원했어요." + (restored?.converted ? " 예전 점수는 상/중/하로 바꿨어요." : ""));
  } catch (err) {
    toast("백업 파일 형식이 올바르지 않아요.", true);
  }
});

/* ---------- 지난 기록 ---------- */
function renderHistory() {
  const box = $("history");
  const empty = state.history.length === 0;
  $("resetBtn").disabled = empty;
  if (empty) {
    box.replaceChildren(el("div", { class: "small muted", style: "padding: 8px 2px" },
      "아직 저장된 기록이 없어요. 자리 배치 화면에서 자리를 확정하면 여기에 쌓입니다."));
    return;
  }
  const last = state.history.length - 1;
  box.replaceChildren(el("div", { class: "timeline" }, state.history.map((rec, i) => {
    const seats = rec.seats || {};
    const groups = [...rec.pairs, ...(rec.solo ? [[rec.solo]] : [])];
    groups.sort((a, b) => (seats[a[0]] ?? 99) - (seats[b[0]] ?? 99));
    return el("details", { class: "t-item" + (i === last ? " latest" : ""), open: i === last },
      el("summary", {},
        el("b", {}, `${i + 1}회차`),
        el("span", { class: "small muted num" }, rec.date),
        el("span", { class: "chev" }, icon("chev", 16))),
      el("ul", { class: "t-pairs" }, groups.map((g) =>
        el("li", {}, el("span", {}, seats[g[0]] ? `${seats[g[0]]}번` : "–"),
          g.length === 2 ? `${g[0]} & ${g[1]}` : `${g[0]} (혼자)`))));
  }).reverse()));
}

$("resetBtn").replaceChildren(icon("trash", 14), "초기화");
$("resetBtn").addEventListener("click", () => {
  if (!confirm("지금까지의 짝꿍·자리 기록을 모두 지울까요? 되돌릴 수 없습니다.")) return;
  state.history = [];
  saveStore();
  renderHistory();
  toast("기록을 초기화했어요.");
});

/* ============================================================
   2. 자리 배치 화면
   ============================================================ */
const genderMode = () => document.querySelector('input[name="gender"]:checked')?.value || "none";
const columns = () => Number(document.querySelector('input[name="cols"]:checked')?.value || 2);
document.querySelectorAll('input[name="gender"]').forEach((r) => r.addEventListener("change", saveStore));
document.querySelectorAll('input[name="cols"]').forEach((r) => r.addEventListener("change", () => {
  saveStore();
  renderResult();
}));

/** 왼쪽 '배치 조건' 요약과 명단 문제 안내 */
function renderConditions() {
  const list = namedStudents();
  const item = (label, ...value) => el("li", {}, el("span", {}, label), el("b", {}, ...value));
  $("conds").replaceChildren(
    item("학생", `${list.length}명`, el("span", { class: "muted small" },
      ` (남 ${countBy(list, "gender", "남")} · 여 ${countBy(list, "gender", "여")})`)),
    item("성적", GRADES.map((g) => `${g} ${countBy(list, "grade", g)}`).join(" · ")),
    item("짝 금지", `${state.bans.length}쌍`),
    item("지난 기록", `${state.history.length}회`),
  );
  let problem = null;
  try { parseStudents(list); } catch (e) { problem = e.message; }
  $("rosterProblem").replaceChildren(problem
    ? el("div", { class: "alert-box" }, icon("alert", 14), `명단을 확인해주세요: ${problem}`)
    : "");
  $("arrangeBtn").disabled = !!problem;
}

function setArrangeButton(busy) {
  const btn = $("arrangeBtn");
  btn.disabled = busy;
  btn.replaceChildren(busy ? el("span", { class: "spinner" }) : icon("shuffle", 18), busy ? "배치하는 중…" : "자리 바꾸기");
}

async function arrange() {
  setArrangeButton(true);
  $("result").classList.add("busy");
  await new Promise((r) => setTimeout(r, 40)); // 버튼 상태가 먼저 그려지도록
  try {
    const students = parseStudents(namedStudents());
    const arranger = new Arranger(students, state.history, genderMode(), state.bans);
    state.desks = arranger.arrange();
    state.report = arranger.report(state.desks);
    state.confirmed = false;
    renderResult();
  } catch (e) {
    if (!(e instanceof StudentError)) console.error(e);
    toast(e instanceof StudentError ? e.message : "배치 중 오류가 발생했어요.", true);
  } finally {
    setArrangeButton(false);
    $("result").classList.remove("busy");
    renderConditions();
  }
}
$("arrangeBtn").addEventListener("click", arrange);

function tile(kind, label, value, sub) {
  return el("div", { class: `tile ${kind}` },
    el("div", { class: "tile-label" }, label),
    el("div", { class: "tile-value" }, value),
    el("div", { class: "tile-sub" }, sub));
}

function renderEmptyResult() {
  const art = document.createElement("div");
  art.innerHTML = '<svg width="88" height="64" viewBox="0 0 88 64" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">'
    + '<rect x="20" y="2" width="48" height="10" rx="3"/><rect x="4" y="24" width="34" height="14" rx="4"/>'
    + '<rect x="50" y="24" width="34" height="14" rx="4"/><rect x="4" y="46" width="34" height="14" rx="4"/>'
    + '<rect x="50" y="46" width="34" height="14" rx="4"/></svg>';
  $("result").replaceChildren(el("div", { class: "empty" },
    art.firstChild,
    el("strong", {}, "아직 새 자리가 없어요"),
    el("span", { class: "small" }, "배치 조건을 확인하고 ", el("b", {}, "자리 바꾸기"), "를 눌러주세요.")));
  $("status").hidden = true;
}

function renderResult() {
  const { desks, report } = state;
  if (!desks) return renderEmptyResult();
  const byName = Object.fromEntries(state.students.map((s) => [s.name.trim(), s]));
  const repeatSet = new Set(report.repeats.map((r) => pairKey(...r.pair)));
  const mismatchSet = new Set(report.gender_mismatches.map((p) => pairKey(...p)));
  const bannedSet = new Set(report.banned.map((p) => pairKey(...p)));
  const sameDesk = new Set(report.same_desk);

  const tiles = el("div", { class: "tiles" },
    report.banned_count
      ? tile(report.banned.length ? "warn" : "ok", "짝 금지", report.banned.length ? `${report.banned.length}쌍 어김` : "모두 지킴",
          report.banned.length ? "조합상 불가피" : `${report.banned_count}쌍 설정됨`)
      : null,
    tile(report.repeats.length ? "warn" : "ok", "예전 짝 중복", `${report.repeats.length}쌍`,
      report.repeats.length ? "조합이 부족해 불가피" : "모두 새로운 짝"),
    report.has_last_desk
      ? tile(report.same_desk.length ? "warn" : "ok", "연속 같은 책상", `${report.same_desk.length}명`,
          report.same_desk.length ? "배치상 불가피" : "모두 다른 책상으로")
      : tile("off", "연속 같은 책상", "–", "첫 배치라 해당 없음"),
    !report.gender_rule
      ? tile("off", "성별 배치", "고려 안 함", "성별 무관")
      : tile(report.gender_mismatches.length ? "warn" : "ok", report.gender_rule,
          report.gender_mismatches.length ? `${report.gender_mismatches.length}쌍 예외` : "모두 지킴",
          report.has_gender ? (report.gender_mismatches.length ? "인원 구성상 불가피" : "조건 충족") : "성별 정보 없음"),
    tile("ok", "성적 균형 짝", `${report.grade_balanced} / ${report.pair_total}쌍`, "상+하 또는 중+중"),
  );

  const notes = [];
  if (report.banned.length) notes.push("짝 금지 조합을 피할 수 없었어요: " +
    report.banned.map(([a, b]) => `${a} & ${b}`).join(", "));
  if (report.repeats.length) notes.push("예전 짝과 다시 짝: " +
    report.repeats.map((r) => `${r.pair[0]} & ${r.pair[1]} (${r.count}회)`).join(", "));
  if (report.same_desk.length) notes.push("지난번과 같은 책상: " + report.same_desk.join(", "));
  if (report.gender_rule && report.gender_mismatches.length) notes.push(`${report.gender_rule} 예외: ` +
    report.gender_mismatches.map(([a, b]) => `${a} & ${b}`).join(", "));

  const seat = (name) => {
    const s = byName[name];
    const same = sameDesk.has(name);
    return el("div", { class: "seat" + (same ? " same" : ""), title: same ? "지난번과 같은 책상" : null },
      same ? el("span", { class: "seat-badge", "aria-label": "지난번과 같은 책상" }) : null,
      avatar(s),
      el("div", { class: "name" }, name),
      el("div", { class: "meta" },
        s.gender ? el("span", { class: GCLASS[s.gender] }, s.gender) : null,
        s.gender ? " · " : null,
        "성적 ", el("span", { class: "lv" }, s.grade)));
  };

  const grid = el("div", { class: "desks", style: `grid-template-columns: repeat(${columns()}, minmax(0, 1fr))` },
    desks.map((g, i) => {
      const flags = [];
      if (g.length === 2 && bannedSet.has(pairKey(...g))) flags.push("짝 금지");
      if (g.length === 2 && repeatSet.has(pairKey(...g))) flags.push("예전 짝");
      if (g.length === 2 && mismatchSet.has(pairKey(...g))) flags.push("성별");
      return el("div", { class: "desk" + (flags.length ? " flag" : ""), style: `--i:${i}` },
        el("div", { class: "desk-head" },
          el("span", { class: "desk-no" }, `${i + 1}번 책상`),
          flags.length ? el("div", { class: "flags" }, flags.map((f) => el("span", { class: "flag-chip" }, f))) : null),
        el("div", { class: "desk-seats" },
          g.map(seat),
          g.length === 1 ? el("div", { class: "seat vacant" }, "빈자리") : null));
    }));

  $("result").replaceChildren(...[
    tiles,
    notes.length ? el("ul", { class: "notes" }, notes.map((n) => el("li", {}, icon("alert", 14), n))) : null,
    el("div", { class: "classroom" }, el("div", { class: "board" }, "칠판"), grid),
    el("div", { class: "actions" },
      el("button", { class: "btn", onclick: arrange, disabled: state.confirmed }, icon("refresh"), "다시 섞기"),
      el("button", { class: "btn", onclick: () => window.print() }, icon("printer"), "인쇄"),
      el("span", { class: "spacer" }),
      el("button", { class: "btn primary", onclick: confirmSeats, disabled: state.confirmed },
        icon("check"), state.confirmed ? "확정됨" : "이 자리로 확정")),
  ].filter(Boolean));

  const status = $("status");
  status.hidden = false;
  status.className = "badge " + (state.confirmed ? "done" : "pending");
  status.textContent = state.confirmed ? `${state.history.length}회차로 저장됨` : "확정 전";
}

function confirmSeats() {
  const seated = state.desks.flat().slice().sort();
  const current = namedStudents().map((s) => s.name.trim()).sort();
  if (seated.join("\u0000") !== current.join("\u0000")) {
    toast("배치 이후 학생 명단이 바뀌었어요. 자리를 다시 바꿔주세요.", true);
    return;
  }
  state.history.push(makeRecord(state.desks));
  state.confirmed = true;
  saveStore();
  renderResult();
  renderHistory();
  renderConditions();
  toast("저장했어요. 다음에는 이번 짝꿍과 책상을 피해서 배치합니다.");
}

/* ============================================================
   시작
   ============================================================ */
(function init() {
  setArrangeButton(false);
  const saved = loadStore();
  if (saved) {
    const { rows, converted } = normalizeStudents(saved.students);
    state.students = rows;
    state.history = isValidHistory(saved.history) ? saved.history : [];
    state.bans = validBans(saved.bans);
    applySettings(saved);
    if (converted) {
      saveStore();
      setTimeout(() => toast("예전에 입력한 점수를 상/중/하로 바꿨어요. 학생 정보에서 확인해주세요."), 300);
    }
  } else {
    state.students = SAMPLE.map((s) => ({ ...s }));
  }
  renderRoster();
  renderBans();
  renderHistory();
  renderResult();

  const requested = location.hash.slice(1);
  let ready = true;
  try { parseStudents(namedStudents()); } catch { ready = false; }
  const start = SCREENS.includes(requested) ? requested : ready ? "seats" : "students";
  if (location.hash !== `#${start}`) history.replaceState(null, "", `#${start}`);
  showScreen(start);
})();
</script>
</body>
</html>
